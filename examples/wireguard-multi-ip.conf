# WireGuard configuration using multiple IP addresses
# Server configuration

[Interface]
# Main server address
Address = 10.0.0.1/32
PrivateKey = YOUR_SERVER_PRIVATE_KEY
ListenPort = 51820

# Additional IPs for specific purposes
PostUp = ip addr add 10.0.0.2/32 dev %i
PostUp = ip addr add 10.0.0.3/32 dev %i

# Routing for multiple IPs
PostUp = ip route add 10.0.0.0/24 dev %i table 1000
PostUp = ip rule add from 10.0.0.2 table 1000
PostUp = ip rule add from 10.0.0.3 table 1000

# Client 1 - uses specific IP
[Peer]
PublicKey = CLIENT1_PUBLIC_KEY
AllowedIPs = 10.0.0.10/32
# This client will always get 10.0.0.10

# Client 2 - uses different IP
[Peer]
PublicKey = CLIENT2_PUBLIC_KEY
AllowedIPs = 10.0.0.11/32
# This client will always get 10.0.0.11

# Client 3 - range of IPs
[Peer]
PublicKey = CLIENT3_PUBLIC_KEY
AllowedIPs = 10.0.0.20/29
# This client can use 10.0.0.20-10.0.0.27

# Persistent keepalive
PersistentKeepalive = 25