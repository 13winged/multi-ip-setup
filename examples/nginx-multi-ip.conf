# Nginx configuration for multiple IP addresses
# Each server block listens on a different IP

# Server for main domain on primary IP
server {
    listen 80;
    listen 443 ssl;
    server_name example.com www.example.com;
    
    # SSL configuration
    ssl_certificate /etc/ssl/certs/example.com.crt;
    ssl_certificate_key /etc/ssl/private/example.com.key;
    
    root /var/www/example.com;
    index index.html index.php;
    
    location / {
        try_files $uri $uri/ =404;
    }
}

# Server for API on different IP
server {
    listen 10.0.0.2:80;
    listen 10.0.0.2:443 ssl;
    server_name api.example.com;
    
    ssl_certificate /etc/ssl/certs/api.example.com.crt;
    ssl_certificate_key /etc/ssl/private/api.example.com.key;
    
    root /var/www/api.example.com;
    index index.php;
    
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }
    
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/var/run/php/php8.1-fpm.sock;
    }
}

# Server for static content on another IP
server {
    listen 10.0.0.3:80;
    listen 10.0.0.3:443 ssl;
    server_name cdn.example.com;
    
    ssl_certificate /etc/ssl/certs/cdn.example.com.crt;
    ssl_certificate_key /etc/ssl/private/cdn.example.com.key;
    
    root /var/www/cdn.example.com;
    
    # Cache settings for static content
    location ~* \.(jpg|jpeg|png|gif|ico|css|js)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

# Server for admin panel on separate IP
server {
    listen 10.0.0.4:443 ssl;
    server_name admin.example.com;
    
    ssl_certificate /etc/ssl/certs/admin.example.com.crt;
    ssl_certificate_key /etc/ssl/private/admin.example.com.key;
    
    root /var/www/admin.example.com;
    index index.php;
    
    # Restrict access by IP
    allow 10.0.0.100;
    allow 10.0.0.101;
    deny all;
    
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }
    
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/var/run/php/php8.1-fpm.sock;
    }
}